<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JB Design | 프리미엄 인테리어 & 공간 기획</title>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body { font-family: 'Helvetica Neue', 'Noto Sans KR', sans-serif; color: #111; background: #fff; }
			a { text-decoration: none; color: inherit; }

			.navbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 20px 50px;
				border-bottom: 1px solid #eaeaea;
				position: sticky;
				top: 0;
				background: rgba(255, 255, 255, 0.95);
				z-index: 100;
			}

			.logo {
				display: flex;
				align-items: center;
				font-size: 26px;
				font-weight: 900;
				letter-spacing: 1.5px;
			}

			.logo-img { height: 35px; margin-right: 12px; object-fit: contain; }

			.nav-links {
				display: flex;
				gap: 35px;
				font-size: 15px;
				font-weight: 600;
				align-items: center;
			}

			.nav-links a:hover { color: #666; transition: color 0.3s; }

			.login-btn {
				padding: 8px 16px;
				background: #111;
				color: #fff !important;
				border-radius: 4px;
				transition: background 0.3s;
			}

			.login-btn:hover { background: #333; }

			.language-selector {
				display: flex;
				gap: 8px;
				align-items: center;
				margin-left: auto;
				margin-right: 20px;
			}

			.language-btn {
				padding: 6px 12px;
				border: 1px solid #ddd;
				background: #fff;
				border-radius: 4px;
				cursor: pointer;
				font-size: 12px;
				font-weight: 600;
				transition: all 0.3s ease;
				color: #111;
			}

			.language-btn:hover {
				border-color: #111;
				background: #f5f5f5;
			}

			.language-btn.active {
				background: #111;
				color: #fff;
				border-color: #111;
			}

			.hero {
				position: relative;
				width: 100%;
				height: 75vh;
				background: #111 url('메인화면_대표사진.jpg') no-repeat center center/cover;
				display: flex;
				align-items: center;
				padding: 0 10%;
				color: #fff;
			}

			.hero::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.4);
				z-index: 1;
			}

			.hero-content {
				position: relative;
				z-index: 2;
				max-width: 650px;
			}

			.hero-content h1 {
				font-size: 52px;
				line-height: 1.25;
				margin-bottom: 20px;
				font-weight: 800;
			}

			.hero-content p {
				font-size: 18px;
				margin-bottom: 35px;
				opacity: 0.9;
				line-height: 1.6;
			}

			.btn {
				padding: 15px 30px;
				background: #fff;
				color: #111;
				font-size: 16px;
				font-weight: bold;
				border-radius: 4px;
				cursor: pointer;
				display: inline-block;
				transition: background 0.3s;
			}

			.btn:hover { background: #eee; }

			.about-section {
				padding: 70px 20px;
				background: #fff;
				border-bottom: 1px solid #eaeaea;
			}

			.about-inner {
				max-width: 1000px;
				margin: 0 auto;
				text-align: center;
			}

			.about-inner h2 {
				font-size: 32px;
				font-weight: 800;
				margin-bottom: 16px;
			}

			.about-inner p {
				color: #555;
				line-height: 1.8;
				font-size: 16px;
			}

			.stats {
				display: flex;
				justify-content: space-evenly;
				padding: 60px 20px;
				background: #fafafa;
				text-align: center;
				border-bottom: 1px solid #eaeaea;
			}

			.stat-item h3 {
				font-size: 36px;
				font-weight: 800;
				margin-bottom: 8px;
				color: #111;
			}

			.stat-item p {
				font-size: 15px;
				color: #555;
				font-weight: 500;
			}

			.portfolio-section {
				padding: 80px 50px;
				max-width: 1400px;
				margin: 0 auto;
			}

			.section-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-end;
				margin-bottom: 40px;
				flex-wrap: wrap;
				gap: 20px;
			}

			.section-title { font-size: 32px; font-weight: 800; }

			.tabs { display: flex; gap: 10px; }

			.tabs button {
				padding: 10px 20px;
				border: 1px solid #ddd;
				background: #fff;
				border-radius: 30px;
				cursor: pointer;
				font-size: 15px;
				font-weight: 600;
				transition: all 0.3s ease;
			}

			.tabs button.active, .tabs button:hover {
				background: #111;
				color: #fff;
				border-color: #111;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
				gap: 40px;
			}

			.card {
				cursor: pointer;
				transition: transform 0.3s ease;
			}

			.card:hover { transform: translateY(-8px); }

			.card-img {
				width: 100%;
				height: 280px;
				background-color: #e0e0e0;
				border-radius: 8px;
				margin-bottom: 18px;
				object-fit: cover;
			}

			.card-title {
				font-size: 18px;
				font-weight: 800;
				margin-bottom: 8px;
				color: #111;
			}

			.card-desc {
				font-size: 15px;
				color: #666;
				line-height: 1.4;
			}

			.footer {
				background: #111;
				color: #fff;
				padding: 70px 50px 30px;
				font-size: 14px;
			}

			.footer-cols {
				display: flex;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 40px;
				margin-bottom: 50px;
				max-width: 1400px;
				margin-left: auto;
				margin-right: auto;
			}

			.footer-col {
				flex: 1;
				min-width: 220px;
			}

			.footer-col h4 {
				margin-bottom: 20px;
				font-size: 18px;
				font-weight: 700;
			}

			.footer-col p, .footer-col a {
				color: #aaa;
				margin-bottom: 12px;
				display: block;
				line-height: 1.6;
				transition: color 0.3s;
			}

			.footer-col a:hover { color: #fff; }

			.footer-bottom {
				text-align: center;
				color: #666;
				border-top: 1px solid #333;
				padding-top: 25px;
				margin-top: 20px;
			}

			@media (max-width: 768px) {
				.navbar {
					padding: 15px 20px;
					flex-direction: column;
					gap: 15px;
				}

				.nav-links {
					flex-direction: column;
					gap: 10px;
					width: 100%;
				}

				.nav-links a { padding: 8px 0; }

				.language-selector {
					margin-left: 0;
					margin-right: 0;
					width: 100%;
					justify-content: center;
				}

				.hero-content h1 { font-size: 36px; }
				.stats { flex-direction: column; gap: 30px; }
				.portfolio-section { padding: 50px 20px; }
			}
		</style>
	</head>
